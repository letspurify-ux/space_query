name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.93.1"

jobs:
  verify:
    name: Verify release source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  compliance:
    name: Verify release compliance files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal

      - name: Verify tns-thin package metadata and contents
        shell: bash
        run: |
          grep -Fx 'license = "Apache-2.0"' crates/tns-thin/Cargo.toml
          cargo package --manifest-path crates/tns-thin/Cargo.toml --locked --list > package-files.txt
          for required in LICENSE-APACHE LICENSE-MIT NOTICE PROVENANCE.md THIRD_PARTY_NOTICES.md; do
            grep -Fx "$required" package-files.txt
          done

      - name: Verify generated dependency licenses
        shell: bash
        run: |
          for required in \
            licenses/cfltk/LICENSE \
            licenses/zstd/LICENSE \
            licenses/odpi-c/LICENSE.txt \
            licenses/odpi-c/NOTICE.txt; do
            test -f "$required"
          done
          cargo install cargo-about --locked --version 0.9.0 --features cli
          cargo about generate --locked about.hbs -o generated-third-party-dependencies.md
          # cargo-about can order crates in Used-by lists differently by host.
          python3 - <<'PY'
          import re
          from pathlib import Path

          used_by_block = re.compile(r"(?m)(?<=^Used by:\n)(?:^- .*\n)+")

          def normalize_used_by(source: str, destination: str) -> None:
              text = Path(source).read_text(encoding="utf-8")
              normalized = used_by_block.sub(
                  lambda match: "".join(sorted(match.group().splitlines(keepends=True))),
                  text,
              )
              Path(destination).write_text(normalized, encoding="utf-8")

          normalize_used_by(
              "THIRD_PARTY_DEPENDENCIES.md",
              "normalized-third-party-dependencies.md",
          )
          normalize_used_by(
              "generated-third-party-dependencies.md",
              "normalized-generated-third-party-dependencies.md",
          )
          PY
          cmp normalized-third-party-dependencies.md normalized-generated-third-party-dependencies.md

  build:
    name: Build ${{ matrix.name }}
    needs: [verify, compliance]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            archive: space_query-macos-arm64.zip
          - name: Windows x86_64
            os: windows-latest
            archive: space_query-windows-x86_64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal

      - name: Build release binary
        run: cargo build --release --locked --bin space_query

      - name: Package macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          package_dir="dist/package"
          licenses_dir="$package_dir/licenses"
          mkdir -p "$licenses_dir/tns-thin" "$licenses_dir/go-ora" "$licenses_dir/python-oracledb" \
            "$licenses_dir/cfltk" "$licenses_dir/zstd" "$licenses_dir/odpi-c"

          cp target/release/space_query DISCLAIMER.md "$package_dir/"
          cp LICENSE-MIT LICENSE-APACHE NOTICE THIRD_PARTY_NOTICES.md THIRD_PARTY_DEPENDENCIES.md "$licenses_dir/"
          cp crates/tns-thin/NOTICE crates/tns-thin/THIRD_PARTY_NOTICES.md \
            crates/tns-thin/PROVENANCE.md "$licenses_dir/tns-thin/"
          cp vendor/go-ora/LICENSE "$licenses_dir/go-ora/"
          cp vendor/python-oracledb/LICENSE.txt vendor/python-oracledb/NOTICE.txt \
            vendor/python-oracledb/THIRD_PARTY_LICENSES.txt "$licenses_dir/python-oracledb/"
          cp licenses/cfltk/LICENSE "$licenses_dir/cfltk/"
          cp licenses/zstd/LICENSE "$licenses_dir/zstd/"
          cp licenses/odpi-c/LICENSE.txt licenses/odpi-c/NOTICE.txt "$licenses_dir/odpi-c/"

          rust_copyright="$(rustc --print sysroot)/share/doc/rust/COPYRIGHT.html"
          test -f "$rust_copyright"
          cp "$rust_copyright" "$licenses_dir/RUST_COPYRIGHT.html"

          (cd "$package_dir" && zip -r "../${{ matrix.archive }}" space_query DISCLAIMER.md licenses)

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "dist/package"
          $licensesDir = "$packageDir/licenses"
          New-Item -ItemType Directory -Force -Path @(
            $licensesDir
            "$licensesDir/tns-thin"
            "$licensesDir/go-ora"
            "$licensesDir/python-oracledb"
            "$licensesDir/cfltk"
            "$licensesDir/zstd"
            "$licensesDir/odpi-c"
          ) | Out-Null

          Copy-Item -Path @(
            "target/release/space_query.exe"
            "DISCLAIMER.md"
          ) -Destination $packageDir
          Copy-Item -Path @(
            "LICENSE-MIT"
            "LICENSE-APACHE"
            "NOTICE"
            "THIRD_PARTY_NOTICES.md"
            "THIRD_PARTY_DEPENDENCIES.md"
          ) -Destination $licensesDir
          Copy-Item -Path @(
            "crates/tns-thin/NOTICE"
            "crates/tns-thin/THIRD_PARTY_NOTICES.md"
            "crates/tns-thin/PROVENANCE.md"
          ) -Destination "$licensesDir/tns-thin/"
          Copy-Item vendor/go-ora/LICENSE -Destination "$licensesDir/go-ora/"
          Copy-Item -Path @(
            "vendor/python-oracledb/LICENSE.txt"
            "vendor/python-oracledb/NOTICE.txt"
            "vendor/python-oracledb/THIRD_PARTY_LICENSES.txt"
          ) -Destination "$licensesDir/python-oracledb/"
          Copy-Item licenses/cfltk/LICENSE -Destination "$licensesDir/cfltk/"
          Copy-Item licenses/zstd/LICENSE -Destination "$licensesDir/zstd/"
          Copy-Item -Path @(
            "licenses/odpi-c/LICENSE.txt"
            "licenses/odpi-c/NOTICE.txt"
          ) -Destination "$licensesDir/odpi-c/"

          $rustCopyright = Join-Path (rustc --print sysroot) "share/doc/rust/COPYRIGHT.html"
          if (-not (Test-Path $rustCopyright)) {
            throw "Rust copyright file not found: $rustCopyright"
          }
          Copy-Item $rustCopyright -Destination "$licensesDir/RUST_COPYRIGHT.html"

          Compress-Archive -Path "$packageDir/*" -DestinationPath "dist/${{ matrix.archive }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Verify release archive contents
        shell: bash
        run: |
          rm -rf verify
          mkdir -p verify/macos verify/windows
          unzip -q dist/space_query-macos-arm64.zip -d verify/macos
          unzip -q dist/space_query-windows-x86_64.zip -d verify/windows
          test -f verify/macos/space_query
          test -f verify/macos/DISCLAIMER.md
          test -f verify/windows/space_query.exe
          test -f verify/windows/DISCLAIMER.md
          for platform in macos windows; do
            for required in \
              LICENSE-APACHE \
              LICENSE-MIT \
              NOTICE \
              THIRD_PARTY_NOTICES.md \
              THIRD_PARTY_DEPENDENCIES.md \
              tns-thin/NOTICE \
              tns-thin/THIRD_PARTY_NOTICES.md \
              tns-thin/PROVENANCE.md \
              go-ora/LICENSE \
              python-oracledb/LICENSE.txt \
              python-oracledb/NOTICE.txt \
              python-oracledb/THIRD_PARTY_LICENSES.txt \
              cfltk/LICENSE \
              zstd/LICENSE \
              odpi-c/LICENSE.txt \
              odpi-c/NOTICE.txt \
              RUST_COPYRIGHT.html; do
              test -f "verify/$platform/licenses/$required"
            done
          done

      - name: Generate and verify SHA-256 checksums
        working-directory: dist
        shell: bash
        run: |
          sha256sum \
            space_query-macos-arm64.zip \
            space_query-windows-x86_64.zip > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
