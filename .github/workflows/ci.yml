name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_VERSION: "1.93.1"

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libx11-dev libxext-dev libxft-dev libxinerama-dev
          libxcursor-dev libxrender-dev libxfixes-dev
          xauth xvfb

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install "$RUST_VERSION"
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$package_version"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint main package
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Lint Oracle Thin package
        run: >-
          cargo clippy --locked
          --manifest-path crates/tns-thin/Cargo.toml
          --all-targets -- -D warnings

      - name: Test main package
        run: xvfb-run -a cargo test --locked

      - name: Test Oracle Thin package
        run: cargo test --locked --manifest-path crates/tns-thin/Cargo.toml

  platform-check:
    name: Build check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: macOS arm64
            os: macos-latest
          - name: Windows x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libx11-dev libxext-dev libxft-dev libxinerama-dev
          libxcursor-dev libxrender-dev libxfixes-dev

      - name: Install pinned Rust toolchain
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal

      - name: Check application build
        run: cargo check --locked --bin space_query
