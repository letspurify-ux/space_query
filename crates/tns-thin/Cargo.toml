[package]
name = "tns-thin"
version = "0.1.0"
edition = "2021"
description = "Thin TNS client for use with Oracle Database"
license = "Apache-2.0"
repository = "https://github.com/letspurify-ux/space_query"
readme = "README.md"
keywords = ["oracle", "database", "tns", "client"]
categories = ["database"]

[dependencies]
aes = "0.8"
cbc = "0.2"
chrono = "0.4"
hmac = "0.13"
libc = "0.2"
md-5 = "0.10"
once_cell = "1.19"
pbkdf2 = "0.12"
rand = "0.10"
sha1 = "0.10"
sha2 = "0.11"
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[dev-dependencies]
